; AquaNode firmware. Build: pio run   Upload: pio run -t upload   Serial: pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev          ; works for most ESP32-WROOM DevKit boards; change at T0 if needed
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature
  madhephaestus/ESP32Servo
  bblanchon/ArduinoJson@^7
