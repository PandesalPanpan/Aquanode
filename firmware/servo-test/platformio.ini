; Servo bench test: spins the feeder servo nonstop on IO13. Separate from the AquaNode firmware.
; Upload (hold BOOT): pio run -t upload   Serial: pio device monitor
[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = madhephaestus/ESP32Servo
